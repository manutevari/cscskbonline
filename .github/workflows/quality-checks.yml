name: CSCSKB Quality Gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [repair/phase-1-security-appointment]

permissions:
  contents: read

jobs:
  frontend-quality:
    name: Frontend QA — install, audit, typecheck, build, smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Reproducible install
        run: npm ci
      - name: Dependency security audit
        run: npm audit --audit-level=high
      - name: TypeScript check
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Start production server for smoke tests
        run: |
          npm run start -- --port 3100 > /tmp/cscskb-next.log 2>&1 &
          echo $! > /tmp/cscskb-next.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3100/ >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:3100/ >/dev/null
      - name: Platform smoke tests
        run: SMOKE_BASE_URL=http://127.0.0.1:3100 npm run smoke
      - name: Stop server
        if: always()
        run: |
          if [ -f /tmp/cscskb-next.pid ]; then kill "$(cat /tmp/cscskb-next.pid)" || true; fi
          cat /tmp/cscskb-next.log || true

  python-quality:
    name: Python syntax validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python sources
        run: |
          python - <<'PY'
          from pathlib import Path
          import py_compile
          files = [p for p in Path('.').rglob('*.py') if '.git' not in p.parts and '__pycache__' not in p.parts]
          for path in files:
              py_compile.compile(str(path), doraise=True)
          print(f"Compiled {len(files)} Python files")
          PY
