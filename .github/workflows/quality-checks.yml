name: CSCSKB Quality Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "repair/**"]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend install, audit, and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Check committed lockfile consistency
        run: |
          node -e "const p=require('./package.json'),l=require('./package-lock.json'); const a=Object.keys(p.dependencies||{}).sort().join(','),b=Object.keys(l.packages[''].dependencies||{}).sort().join(','); if(a!==b){console.error('package.json/package-lock dependency mismatch'); process.exit(1)}"
        continue-on-error: true
      - run: npm install
      - name: Apply safe dependency updates
        run: npm audit fix
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-lock-repair
          path: frontend/package-lock.json
          retention-days: 3
      - name: Dependency vulnerability report
        run: npm audit --audit-level=high
        continue-on-error: true
      - run: npm run build

  python:
    name: Python syntax validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - name: Compile Python sources
        run: |
          python - <<'PY'
          from pathlib import Path
          import py_compile
          files = [p for p in Path('.').rglob('*.py') if '.git' not in p.parts and '__pycache__' not in p.parts]
          for path in files:
              py_compile.compile(str(path), doraise=True)
          print(f"Compiled {len(files)} Python files")
          PY
