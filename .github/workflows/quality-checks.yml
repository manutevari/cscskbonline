name: CSCSKB Quality Checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend install, security audit, build and Document Tools E2E
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify package and lockfile dependency consistency
        run: |
          node -e "const p=require('./package.json'),l=require('./package-lock.json'); const a=Object.keys(p.dependencies||{}).sort().join(','),b=Object.keys(l.packages[''].dependencies||{}).sort().join(','); if(a!==b){console.error('package.json/package-lock dependency mismatch'); process.exit(1)}"
      - name: Run Phase 1-3 security contract checks
        run: node qa/phases-1-3-security-contract.mjs
      - name: Install locked dependencies
        run: npm ci
      - name: Security audit
        run: npm audit --audit-level=high
      - name: Production build
        run: npm run build
      - name: Install pinned Playwright runner
        run: npm install --no-save --package-lock=false playwright@latest
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Install qpdf for encrypted-PDF regression fixture
        run: |
          sudo apt-get update
          sudo apt-get install -y qpdf
      - name: Generate encrypted PDF password fixture
        run: node qa/create-password-pdf-fixture.mjs
      - name: Start production server
        run: |
          npm run start > /tmp/cscskb-next.log 2>&1 &
          echo $! > /tmp/cscskb-next.pid
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/document-tools > /dev/null; then
              echo "Next.js server ready"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/cscskb-next.log
          exit 1
      - name: Document Tools browser regression suite
        run: node qa/document-tools.e2e.mjs
        env:
          BASE_URL: http://127.0.0.1:3000
      - name: Upload server logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: document-tools-qa-server-log
          path: /tmp/cscskb-next.log
          retention-days: 7

  python:
    name: Python syntax validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python sources
        run: |
          python - <<'PY'
          from pathlib import Path
          import py_compile
          files = [p for p in Path('.').rglob('*.py') if '.git' not in p.parts and '__pycache__' not in p.parts]
          for path in files:
              py_compile.compile(str(path), doraise=True)
          print(f"Compiled {len(files)} Python files")
          PY
