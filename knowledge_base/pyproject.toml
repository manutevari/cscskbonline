[project]
name = "cscskb-knowledge-base"
version = "0.1.0"
description = "Pydantic-validated, source-grounded RAG service for CSCSKB Online"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "supabase>=2.9,<3",
  "openai>=1.50,<3",
  "pypdf>=5,<7",
  "python-multipart>=0.0.12,<1",
  "langchain-core>=0.3,<2",
  "langchain-openai>=0.3,<2",
  "langgraph>=0.2,<2",
]

[tool.ruff]
line-length = 100
target-version = "py311"
